[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb84-course-project"
version = "1.0.0"
description = "Reproducible BB84 simulation and security analysis for teaching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.scripts]
bb84 = "bb84.__main__:main"

[tool.setuptools.packages.find]
include = ["bb84*"]
[tool.setuptools.package-data]
bb84 = ['*.css']
